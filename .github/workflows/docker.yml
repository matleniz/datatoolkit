name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matleniz/datatoolkit-engine

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dtk-engine:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Run container
        run: |
          mkdir data
          sudo chown 1000:1000 data
          docker run -d --name dtk -p 127.0.0.1:8765:8765 -v "$PWD/data:/data" dtk-engine:smoke
      - name: Wait for healthy
        run: |
          status=starting
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dtk)
            echo "health: $status"
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            docker logs dtk
            exit 1
          fi
      - name: Key list
        run: curl -fsS localhost:8765/api/keys | grep -q dataset_overview
      - name: Upload ~2 MB CSV
        run: |
          python3 -c "
          import random
          random.seed(0)
          print('id,x,y,label')
          for i in range(60000):
              print(f'{i},{random.random():.6f},{random.random():.6f},{random.choice(\"abc\")}')
          " > smoke.csv
          ls -l smoke.csv
          curl -fsS -X PUT --data-binary @smoke.csv localhost:8765/api/uploads/smoke.csv | tee upload.json
      - name: Check upload ownership
        run: |
          f=$(ls data/uploads/*/smoke.csv)
          stat -c '%u %n' "$f"
          [ "$(stat -c %u "$f")" = 1000 ]
      - name: Run dataset_overview on the upload
        run: |
          path=$(python3 -c "import json; print(json.load(open('upload.json'))['path'])")
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"params\": {\"source\": {\"kind\": \"csv\", \"path\": \"$path\"}}}" \
            localhost:8765/api/keys/dataset_overview/run | tee run.json | head -c 500
      - name: Logs on failure
        if: failure()
        run: docker logs dtk
      - name: Cleanup
        if: always()
        run: docker rm -f dtk
      - name: Root-owned bind mount (daemon-created dir)
        run: |
          sudo mkdir data-root
          sudo chown root:root data-root
          docker run -d --name dtk-root -p 127.0.0.1:8766:8765 -v "$PWD/data-root:/data" dtk-engine:smoke
          status=starting
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dtk-root)
            echo "health: $status"
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          [ "$status" = healthy ]
          curl -fsS -X PUT --data-binary @smoke.csv localhost:8766/api/uploads/smoke.csv
          f=$(ls data-root/uploads/*/smoke.csv)
          stat -c '%u %n' "$f"
          [ "$(stat -c %u "$f")" = 1000 ]
          # PID 1 is dtk-api itself (setpriv execs into it)
          docker exec dtk-root cat /proc/1/cmdline | tr '\0' ' ' | tee cmdline; echo
          grep -q dtk-api cmdline
          uid=$(docker exec dtk-root awk '/^Uid:/{print $2}' /proc/1/status)
          echo "dtk-api uid: $uid"
          [ "$uid" = 1000 ]
      - name: Logs on failure (root scenario)
        if: failure()
        run: docker logs dtk-root
      - name: Cleanup (root scenario)
        if: always()
        run: docker rm -f dtk-root

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
