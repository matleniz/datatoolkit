name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mirrors the local gate (GATE_CMDS) minus ruff's --fix: CI only checks.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
