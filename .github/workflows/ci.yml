name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Mirrors the local gate (GATE_CMDS) minus ruff's --fix: CI only checks.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Fresh venv per extra, no dev group: catches a first-time install that
  # crashes (datatoolkit-issues#242). The script is also runnable locally.
  install-smoke:
    name: install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/smoke_install.sh
