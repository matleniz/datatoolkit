[project]
name = "dtk-engine"
version = "0.1.0"
description = "datatoolkit engine: keys, registry, JSON contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pandas", "plotly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtk_engine"]
