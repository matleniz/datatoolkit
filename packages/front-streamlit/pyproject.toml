[project]
name = "dtk-streamlit"
version = "0.1.0"
description = "datatoolkit Streamlit front"
requires-python = ">=3.11"
dependencies = ["dtk-engine", "streamlit", "plotly"]

[tool.uv.sources]
dtk-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtk_streamlit"]
