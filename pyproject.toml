[project]
name = "dtk-engine"
version = "0.1.0"
description = "datatoolkit engine: keys, registry, JSON contract"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas",
    "numpy",
    "plotly",
    "scikit-learn>=1.9.1",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.1.0",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]

[project.scripts]
dtk-api = "dtk_engine.http:main"

[dependency-groups]
# fastapi/uvicorn also listed here so `uv sync` (gate) can run the HTTP tests;
# the optional extra `api` is what consumers install for `dtk-api`.
dev = ["ruff", "pytest", "httpx", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtk_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
