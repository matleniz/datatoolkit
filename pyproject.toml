[project]
name = "dtk-engine"
version = "0.1.0"
description = "datatoolkit engine: keys, registry, JSON contract"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas",
    "plotly",
    "scikit-learn>=1.9.1",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.1.0",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtk_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
